<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diviapp - Gestão Financeira</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <header class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm">
            <h1 class="text-3xl font-bold text-indigo-600">Diviapp</h1>
            <div class="text-right">
                <p class="text-sm font-semibold text-slate-500">Gestão Mensal</p>
                <p class="text-xs text-slate-400">Henrique & Camila</p>
            </div>
        </header>

        <!-- Abas de Navegação -->
        <div class="flex space-x-2 border-b border-slate-200 mb-6">
            <button onclick="mudarAba('Casal')" id="aba-Casal" class="tab-btn px-6 py-3 font-semibold text-indigo-600 border-b-2 border-indigo-600">Contas Conjuntas</button>
            <button onclick="mudarAba('Henrique')" id="aba-Henrique" class="tab-btn px-6 py-3 font-semibold text-slate-500 border-b-2 border-transparent hover:text-indigo-600">Despesas Henrique</button>
            <button onclick="mudarAba('Camila')" id="aba-Camila" class="tab-btn px-6 py-3 font-semibold text-slate-500 border-b-2 border-transparent hover:text-indigo-600">Despesas Camila</button>
        </div>

        <!-- Painel de Balanço (Calcula apenas o que já foi PAGO do Casal) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500">
                <h3 class="text-sm text-slate-500 mb-1">Henrique Pagou (Conjunto)</h3>
                <p class="text-2xl font-bold" id="total-henrique">R$ 0,00</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-500">
                <h3 class="text-sm text-slate-500 mb-1">Camila Pagou (Conjunto)</h3>
                <p class="text-2xl font-bold" id="total-camila">R$ 0,00</p>
            </div>
            <div class="bg-indigo-600 text-white p-6 rounded-xl shadow-sm">
                <h3 class="text-sm text-indigo-200 mb-1">Status do Acerto Atual</h3>
                <p class="text-xl font-bold" id="status-acerto">Calculando...</p>
            </div>
        </div>

        <!-- Formulário de Inserção -->
        <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-semibold mb-4">Adicionar / Planejar Conta</h2>
            <form id="form-lancamento" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 items-end">
                
                <div>
                    <label class="block text-sm text-slate-500 mb-1">Responsável</label>
                    <select id="responsavel" class="w-full p-2 border rounded bg-white focus:ring-2 focus:ring-indigo-500">
                        <option value="Casal">Casal (Conjunta)</option>
                        <option value="Henrique">Henrique</option>
                        <option value="Camila">Camila</option>
                    </select>
                </div>

                <div class="lg:col-span-2">
                    <label class="block text-sm text-slate-500 mb-1">Descrição</label>
                    <input type="text" id="descricao" required placeholder="Ex: Aluguel, Supermercado" class="w-full p-2 border rounded focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm text-slate-500 mb-1">Valor (R$)</label>
                    <input type="number" step="0.01" id="valor" required class="w-full p-2 border rounded focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm text-slate-500 mb-1">Vencimento</label>
                    <input type="date" id="data_vencimento" required class="w-full p-2 border rounded focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm text-slate-500 mb-1">Categoria</label>
                    <input type="text" id="categoria" placeholder="Ex: Moradia, Lazer" class="w-full p-2 border rounded focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm text-slate-500 mb-1">Forma de Pagamento</label>
                    <select id="forma_pagamento" class="w-full p-2 border rounded bg-white focus:ring-2 focus:ring-indigo-500">
                        <option value="Pix">Pix</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Débito">Débito</option>
                        <option value="Boleto">Boleto</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm text-slate-500 mb-1">Status</label>
                    <select id="status" class="w-full p-2 border rounded bg-white focus:ring-2 focus:ring-indigo-500">
                        <option value="Pendente">Pendente</option>
                        <option value="Pago">Pago</option>
                        <option value="Atrasado">Atrasado</option>
                    </select>
                </div>

                <div id="div_quem_pagou" class="hidden">
                    <label class="block text-sm text-emerald-600 font-semibold mb-1">Quem pagou?</label>
                    <select id="quem_pagou" class="w-full p-2 border rounded border-emerald-300 bg-emerald-50 focus:ring-2 focus:ring-emerald-500">
                        <option value="">Selecione...</option>
                        <option value="Henrique">Henrique</option>
                        <option value="Camila">Camila</option>
                    </select>
                </div>

                <div class="lg:col-span-4 mt-2">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-semibold p-3 rounded hover:bg-indigo-700 transition">Salvar Lançamento</button>
                </div>
            </form>
        </div>

        <!-- Tabela de Registros -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
                <h3 class="font-semibold text-slate-700" id="titulo-tabela">Lançamentos: Casal</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white border-b">
                            <th class="p-4 text-sm font-semibold text-slate-600">Vencimento</th>
                            <th class="p-4 text-sm font-semibold text-slate-600">Descrição</th>
                            <th class="p-4 text-sm font-semibold text-slate-600">Categoria</th>
                            <th class="p-4 text-sm font-semibold text-slate-600">Pagamento</th>
                            <th class="p-4 text-sm font-semibold text-slate-600">Status</th>
                            <th class="p-4 text-sm font-semibold text-slate-600 text-right">Valor</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo" class="divide-y divide-slate-100">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
